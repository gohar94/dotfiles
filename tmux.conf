set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Mouse: select/copy within a single pane; OSC 52 sends copies to local clipboard over SSH
set -g mouse on
set -s set-clipboard on
set -as terminal-features ',*:clipboard'

# Deep scrollback: 2000 lines is not enough to scroll back through a long
# Claude Code session. Only applies to panes created after this is set.
set -g history-limit 200000

# Snappier escape handling for TUIs
set -sg escape-time 10
